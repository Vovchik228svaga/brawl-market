<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Market — Витрина & Mini App</title>
    <style>
        @import url('https://cdnfonts.com');

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #ffffff;
            padding: 20px 0 10px 0;
            text-align: left;
        }

        header h1 {
            margin: 0;
            color: #0077ff;
            font-size: 26px;
            text-align: left;
            padding-left: 20px;
            font-weight: 800;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #666666;
            text-align: left;
            padding-left: 20px;
        }

        .market-nav {
            display: flex !important;
            flex-direction: row !important;
            justify-content: flex-start !important;
            gap: 22px !important;
            padding: 15px 20px !important;
            overflow-x: auto !important;
            white-space: nowrap !important;
            background-color: #ffffff !important;
            width: 100% !important;
            box-sizing: border-box !important;
            scrollbar-width: none;
        }

        .market-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #1f2937;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            min-width: 85px;
            transition: color 0.2s;
        }

        .nav-item:hover {
            color: #000000;
        }

        .nav-icon {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .nav-item:hover .nav-icon {
            background-color: #e5e7eb;
            transform: scale(1.05);
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        .section-title {
            width: 100%;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            color: #333;
            text-align: left;
            padding-left: 20px;
        }

        .card {
            background: linear-gradient(135deg, #120136, #400082);
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            width: 280px;
            padding: 20px;
            color: #fff;
            text-align: left;
            box-sizing: border-box;
        }

        .card h3 {
            margin-top: 0;
            font-size: 18px;
        }

        .card p {
            font-size: 14px;
            color: #ccc;
            height: 60px;
            overflow: hidden;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 15px;
        }

        .btn {
            display: block;
            background-color: #00cc66;
            color: #fff;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 0px #00994d;
            transition: 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>BRAWL MARKET</h1>
        <p>Официальная витрина нашего Telegram Mini App</p>
    </header>

    <nav class="market-nav">
        <a href="#accounts" class="nav-item">
            <div class="nav-icon">👤</div>
            <span>Аккаунты</span>
        </a>
        <a href="#push" class="nav-item">
            <div class="nav-icon">🚀</div>
            <span>Пуш кубков</span>
        </a>
          <a href="#donate" class="nav-item">
                  <div class="nav-icon">💰</div>
            <span>Донат</span>
        </a>
        <a href="#design" class="nav-item">
            <div class="nav-icon">🎨</div>
            <span>Дизайн</span>
        </a>
        <a href="#ads" class="nav-item">
            <div class="nav-icon">📢</div>
            <span>Биржа рекламы</span>
        </a>
    </nav>

    <!-- РАЗДЕЛ 1: АККАУНТЫ -->
    <div class="container" id="accounts">
        <!-- Твои карточки аккаунтов будут тут -->
    </div>

    <!-- РАЗДЕЛ 2: ПУШ КУБКОВ -->
    <div class="container" id="push">
        <!-- Твои карточки пуша кубков будут тут -->
    </div>

    <!-- РАЗДЕЛ 3: ДОНАТ -->
    <div class="container" id="donate">
        <!-- Твои карточки доната будут тут -->
    </div>

    <!-- РАЗДЕЛ 4: ДИЗАЙН -->
    <div class="container" id="design">
        <!-- Твои карточки дизайна будут тут -->
    </div>

    <!-- РАЗДЕЛ 5: БИРЖА РЕКЛАМЫ -->
    <div class="container" id="ads">
        <!-- Твои карточки рекламы будут тут -->
    </div>
</body>
</html>
